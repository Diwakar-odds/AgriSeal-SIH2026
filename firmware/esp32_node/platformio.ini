; PlatformIO Project Configuration for AgriSeal Node
; ESP32-WROOM-32D Firmware
;
; Build:   pio run
; Upload:  pio run --target upload
; Monitor: pio device monitor --baud 115200

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Library dependencies
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5
    sparkfun/SparkFun ATECC508A Arduino Library@^2.0.6
    ; W25Q128 SPI Flash
    Marzogh/SPIMemory@^3.4.0

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DAGRISEAL_VERSION=\"1.0.0\"
    -DCONFIG_MBEDTLS_HARDWARE_AES=y

; Partition scheme — custom for larger app + SPIFFS
board_build.partitions = min_spiffs.csv
