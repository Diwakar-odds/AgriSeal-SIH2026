version: '3.7'

networks:
  agriseal-net:
    name: agriseal-net

services:
  orderer.agriseal.in:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer.agriseal.in
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_KAFKA_TOPIC_REPLICATIONFACTOR=1
      - ORDERER_KAFKA_VERBOSE=true
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ./channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ./crypto-config/ordererOrganizations/agriseal.in/orderers/orderer.agriseal.in/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/agriseal.in/orderers/orderer.agriseal.in/tls/:var/hyperledger/orderer/tls
    ports:
      - 7050:7050
    networks:
      - agriseal-net

  couchdb0:
    image: couchdb:3.3.2
    container_name: couchdb0
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "5984:5984"
    networks:
      - agriseal-net

  peer0.farmer.agriseal.in:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.farmer.agriseal.in
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=agriseal-net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.farmer.agriseal.in
      - CORE_PEER_ADDRESS=peer0.farmer.agriseal.in:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.farmer.agriseal.in:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.farmer.agriseal.in:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.farmer.agriseal.in:7051
      - CORE_PEER_LOCALMSPID=FarmerOrgMSP
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config/peerOrganizations/farmer.agriseal.in/peers/peer0.farmer.agriseal.in/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/farmer.agriseal.in/peers/peer0.farmer.agriseal.in/tls:/etc/hyperledger/fabric/tls
    ports:
      - 7051:7051
    depends_on:
      - couchdb0
      - orderer.agriseal.in
    networks:
      - agriseal-net

  peer0.logistics.agriseal.in:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.logistics.agriseal.in
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=agriseal-net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.logistics.agriseal.in
      - CORE_PEER_ADDRESS=peer0.logistics.agriseal.in:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.logistics.agriseal.in:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.logistics.agriseal.in:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.logistics.agriseal.in:8051
      - CORE_PEER_LOCALMSPID=LogisticsOrgMSP
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config/peerOrganizations/logistics.agriseal.in/peers/peer0.logistics.agriseal.in/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/logistics.agriseal.in/peers/peer0.logistics.agriseal.in/tls:/etc/hyperledger/fabric/tls
    ports:
      - 8051:8051
    depends_on:
      - orderer.agriseal.in
    networks:
      - agriseal-net

  peer0.retailer.agriseal.in:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.retailer.agriseal.in
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=agriseal-net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.retailer.agriseal.in
      - CORE_PEER_ADDRESS=peer0.retailer.agriseal.in:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.retailer.agriseal.in:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.retailer.agriseal.in:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.retailer.agriseal.in:9051
      - CORE_PEER_LOCALMSPID=RetailerOrgMSP
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config/peerOrganizations/retailer.agriseal.in/peers/peer0.retailer.agriseal.in/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/retailer.agriseal.in/peers/peer0.retailer.agriseal.in/tls:/etc/hyperledger/fabric/tls
    ports:
      - 9051:9051
    depends_on:
      - orderer.agriseal.in
    networks:
      - agriseal-net
